<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-page manga - Pose Search</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-title">Pose Search</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Search</a>
        <a href="/upload" class="nav-link">Upload</a>
        <a href="/full-page" class="nav-link active">Full Page</a>
      </div>
    </div>
  </nav>
  <main class="container container-wide">
    <h1>Full-page manga</h1>
    <p>Find panel boundaries, review the segmentation, then search or index poses from the page.</p>
    <form id="page-form">
      <label for="page-input">Manga page image</label>
      <input type="file" id="page-input" accept="image/*" />
      <div class="page-actions">
        <button type="button" id="segment-btn">Segment panels</button>
        <button type="button" id="search-btn">Search poses</button>
        <button type="button" id="index-btn">Add page to index</button>
      </div>
    </form>
    <p id="page-status" role="status"></p>
    <section id="page-preview-section" class="hidden">
      <h2>Page preview</h2>
      <div class="page-image-wrap">
        <img id="page-preview" alt="Selected manga page" />
        <canvas id="page-overlay"></canvas>
      </div>
    </section>
    <section id="page-results" class="hidden">
      <h2>Pose matches</h2>
      <ol id="match-list" class="match-list"></ol>
    </section>
    <section id="error" class="hidden" role="alert"></section>
  </main>
  <script src="/static/full_page.js"></script>
</body>
</html>
